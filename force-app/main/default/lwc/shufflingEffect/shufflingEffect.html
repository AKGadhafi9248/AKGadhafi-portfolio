<template>
  <!-- 🌟 Skill Builds Lab -->
  <section class="projects-section">
    <h1>My Projects</h1>
    <p class="story-text">❝{cloudSubtitle}❞</p>
    <h2 class="section-title">Skill Builds Lab</h2>
    
    <div class="card-container">
      <template for:each={skillProjects} for:item="proj">
        <div key={proj.id} class="project-wrapper">
          <!-- NORMAL CARD VIEW -->
          <template if:false={proj.isCloudView}>
            <div
              class="card"
              data-id={proj.id}
              data-type="skill"
              onclick={showCloudView}
            >
              <template if:true={proj.isNew}>
                <div class="new-tag">NEW</div>
              </template>
              <div class="intro">
                <h1>{proj.title}</h1>
                <p>{proj.description}</p>
                
                <div class="logos">
                  <template for:each={proj.tech} for:item="tech">
                    <img key={tech} src={tech} class="tech-logo" />
                  </template>
                </div>
              </div>
            </div>
          </template>

          <!-- CLOUD VIEW -->
          <template if:true={proj.isCloudView}>
            <div class="cloud-view">
              <img src={cloudImage} class="cloud-img" />

              <div class="typing-box">
                <h2 class="typing-text" data-id={proj.id}></h2>
              </div>

              <div class="cloud-links">
                <a
                  href={proj.demoLink}
                  target="_blank"
                  class="demo-btn"
                  if:true={proj.demoLink}
                >
                  Demo Link
                </a>
                <!-- <a href={proj.githubLink} target="_blank" class="github-btn" if:true={proj.githubLink}>
                                    💻 View Code
                                </a> -->
              </div>

              <button
                class="back-btn"
                data-id={proj.id}
                onclick={closeCloudView}
              >
                ⬅ Back
              </button>
            </div>
          </template>
        </div>
      </template>
    </div>
  </section>

  <!-- Industrial -->
  <section class="projects-section">
    <h2 class="section-title">Industrial Learnings / Commercial Delivery</h2>
    <div class="card-container">
      <template for:each={industrialProjects} for:item="proj">
        <div key={proj.id} class="project-wrapper">
          <!-- NORMAL CARD -->
          <template if:false={proj.isCloudView}>
            <div
              class="card"
              data-id={proj.id}
              data-type="industrial"
              onclick={showCloudView}
            >
              <div class="intro">
                <h1>{proj.title}</h1>
                <p>{proj.description}</p>
                <div class="logos">
                  <template for:each={proj.tech} for:item="tech">
                    <img key={tech} src={tech} class="tech-logo" />
                  </template>
                </div>
              </div>
            </div>
          </template>

          <!-- CLOUD VIEW -->
          <template if:true={proj.isCloudView}>
            <div class="cloud-view">

    <img src={cloudImage} class="cloud-img" />

    <div class="typing-box">
        <h2 class="typing-text" data-id={proj.id}></h2>
    </div>

    <div class="cloud-links">
        <a href={proj.demoLink}
           target="_blank"
           class="demo-btn"
           if:true={proj.demoLink}>
           Demo Link
        </a>
    </div>

    <button class="back-btn"
            data-id={proj.id}
            onclick={closeCloudView}>
        ⬅ Back
    </button>

</div>

          </template>
        </div>
      </template>
    </div>
  </section>

  

</template>
