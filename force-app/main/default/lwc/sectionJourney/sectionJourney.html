  <section class="mypath-section">
    <div class="story-header">
      <h1>Journey of Learning</h1>
      <p class="story-text">❝{cloudSubtitle}❞</p>
    </div>

    <div class="timeline">
      <template if:true={journeyData}>
        <template for:each={journeyData} for:item="item">
          <div key={item.id} class="cloud">
            <div class="cloud-text">
              <h3>{item.medium}</h3>
              <h2>({item.detail})</h2>
              <p class="medium-line">{item.year} | Percentage: {item.standard}</p>
              <p class="small-line">{item.place}</p>
              <p class="desc-line">{item.institution}</p>
            </div>
          </div>
        </template>
      </template>
    </div>
  </section>
